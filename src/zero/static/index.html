<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .video-container img { width: 100%; border: 4px solid #444; border-radius: 8px; }
        .controls { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; justify-content: center; margin-top: 20px; }
        .btn { padding: 20px; font-size: 18px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; user-select: none; }
        .btn:active { background: #0056b3; }
        .btn-stop { background: #dc3545; }
        .btn-stop:active { background: #a71d2a; }
        #up { grid-column: 2; }
        #left { grid-column: 1; grid-row: 2; }
        #stop { grid-column: 2; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }
        #down { grid-column: 2; grid-row: 3; }
        .hint { margin-top: 20px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Robot Camera</h1>
        <div class="video-container">
            <img src="/stream" alt="Robot Camera Stream">
        </div>
        
        <div class="controls">
            <button class="btn" id="up" onmousedown="sendCommand('F')" onmouseup="sendCommand('S')" ontouchstart="sendCommand('F')" ontouchend="sendCommand('S')">W</button>
            <button class="btn" id="left" onmousedown="sendCommand('L')" onmouseup="sendCommand('S')" ontouchstart="sendCommand('L')" ontouchend="sendCommand('S')">A</button>
            <button class="btn btn-stop" id="stop" onclick="sendCommand('S')">STOP</button>
            <button class="btn" id="right" onmousedown="sendCommand('R')" onmouseup="sendCommand('S')" ontouchstart="sendCommand('R')" ontouchend="sendCommand('S')">D</button>
            <button class="btn" id="down" onmousedown="sendCommand('B')" onmouseup="sendCommand('S')" ontouchstart="sendCommand('B')" ontouchend="sendCommand('S')">S</button>
        </div>
        <p class="hint">Use on-screen buttons or WASD keys on your keyboard.</p>
    </div>
    <script src="/script.js"></script>
</body>
</html>
